# SonarCloud Configuration for Video Processor
sonar.projectKey=frameforge-video-processor
sonar.organization=frameforgetech

# Source and test directories
sonar.sources=src
sonar.tests=src

# Test file patterns
sonar.test.inclusions=**/*.test.ts,**/*.spec.ts

# Files to exclude from analysis
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.test.ts,**/*.spec.ts,**/*.config.js,**/*.config.ts,**/*.json,**/*.yml,**/*.yaml,**/__mocks__/**,**/examples/**

# Coverage report paths
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Source encoding
sonar.sourceEncoding=UTF-8

# Language
sonar.language=ts
